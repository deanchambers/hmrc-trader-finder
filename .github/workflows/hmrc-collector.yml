
name: HMRC V5.1 collector - postcode batches

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collection mode'
        required: true
        default: postcode
        type: choice
        options:
          - postcode
          - pilot
      postcode:
        description: 'UK postcode district, e.g. TF2 or WS10'
        required: true
        default: TF2
        type: string
      batch:
        description: 'Maximum new traders to verify this run (1-100)'
        required: true
        default: '25'
        type: string

permissions:
  contents: read

concurrency:
  group: hmrc-collector-supabase
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3'

      - name: Validate inputs and run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ inputs.mode }}
          POSTCODE: ${{ inputs.postcode }}
          BATCH: ${{ inputs.batch }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys

          mode = os.environ['MODE']
          postcode = os.environ['POSTCODE'].strip().upper().replace(' ', '')
          batch = os.environ['BATCH'].strip()

          if mode not in ('postcode', 'pilot'):
              sys.exit('Invalid mode')

          if mode == 'postcode' and not re.fullmatch(r'[A-Z]{1,2}[0-9]{1,2}[A-Z]?', postcode):
              sys.exit('Invalid postcode district (example TF2 or WS10)')

          if not batch.isdigit() or not 1 <= int(batch) <= 100:
              sys.exit('Batch must be an integer from 1 to 100')

          subprocess.run(
              [sys.executable, 'collector.py',
               '--mode', mode,
               '--postcode', postcode,
               '--batch', batch],
              check=True
          )
          PY
