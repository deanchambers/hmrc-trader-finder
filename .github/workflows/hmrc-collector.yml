
name: HMRC V5 collector pilot

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - postcode
      postcode:
        description: Postcode district
        required: false
        default: M1
        type: string
      batch:
        description: Traders per batch
        required: false
        default: '25'
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase

      - name: Run HMRC collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ inputs.mode }}
          POSTCODE: ${{ inputs.postcode }}
          BATCH: ${{ inputs.batch }}
        run: python collector.py

